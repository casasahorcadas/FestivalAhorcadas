  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Fuente tipo máquina de escribir -->
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

  <!-- Iconos Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="icon" href="img/Logo.jpg">

  <style>
    /* Mantener la fuente en todo el sitio */
    body { font-family: 'Special Elite', serif; }
    .site-title { letter-spacing: 1px; }
    @media (max-width: 640px) {
      .site-title { font-size: 1.15rem; }
      .site-subtitle { font-size: 1rem; color: #e50914; }
    }
    img {
      max-width: 100%;
      max-height: 100%;
    }
  /* ======== GALERÍA ======== */
    .galeria-completa-wrapper {
      background-color: white;
      padding: 5px; /* Añade algo de espacio alrededor de las fotos */
  }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between; /* Distribuye el espacio uniformemente */
      margin-left: 0 !important;
      margin-right: 0 !important;
      padding: 0 !important;
      margin-bottom: 20px;
      margin-top: 20px;
         }

    .photo-card {
    /* En escritorio (3 columnas), cada tarjeta ocupará aproximadamente un tercio del ancho */
       width: calc(20% ); /* Ajusta el 10px según el espacio deseado entre fotos */
       margin-left: 30px;
       margin-right: 30px;
       margin-bottom: 20px; /* Espaciado inferior para separar las tarjetas */
      }

    .photo-card:hover {
      transform: translateY(-0.3vw);
      box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.2);
    }

    .photo-card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      display: block;
      cursor: pointer;
      transition: transform 0.4s ease, filter 0.4s ease;
    }

    .photo-card img:hover {
      transform: scale(1.01);
      filter: brightness(1.05);
    }

    
  .caption-bar {
    background: #222;              /* color de fondo de la franja */
    color: #fff;                   /* texto blanco */
    text-align: center;
    font-weight: 500;
    font-size: 1rem;
    padding: 10px 0;
    border-top: 3px solid #e3e3e3; /* línea separadora elegante */
    transition: background 0.3s ease, color 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

/* Efecto al pasar el ratón por la tarjeta */
  .photo-card:hover .caption-bar {
    background: #444;
    color: #f0f0f0;
  }
/* ======== LIGHTBOX ======== */
    .lightbox {
      display: none;
      position: fixed;
      z-index: 10;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .lightbox img {
      max-width: 95vw;
      max-height: 90vh;
      border-radius: 10px;
    }

    .lightbox:target {
      display: flex;
    }
  .video-wrapper {
    width: 60vw;       /* 🔹 Ancho máximo: 80% del viewport */
    max-width: 400px;  /* 🔹 Nunca más grande que 960px */
    }

  .lightbox video {
     width: 100%;
    height: auto;       /* 🔹 Ajusta proporción natural del vídeo */
    border-radius: 10px;
    box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
    background: #000;
    display: block;
  }

    .close {
      position: absolute;
      top: 25px;
      right: 35px;
      color: white;
      font-size: 2rem;
      text-decoration: none;
      z-index: 11;
      transition: opacity 0.3s ease;
    }
    .close:hover {
       opacity: 0.7;
    }

    /* ======== RESPONSIVE ======== */
 @media only screen and (max-width: 600px) {
  .gallery {     /* En móvil, las fotos pueden apilarse o seguir un flujo más compacto */
    justify-content: center; /* Centra las tarjetas si es necesario */
  }
  
  .photo-card {
    width: 100% !important;
    max-width: 100% !important;
    padding: 5px;
    margin: 0 0 15px 0;
  }
  .photo-card img {
  width: 100%;
  height: auto;
  display: block;
}
.photo-card,
.gallery {
  overflow: visible !important;
}
}
   /* ======== MINIATURA DE VIDEO ======== */
.video-card {
  position: relative;
}

.video-thumbnail {
  position: relative;
  width: 100%;
  height: 300px;
  overflow: hidden;
  border-radius: 10px;
}

.video-thumbnail video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  filter: brightness(0.8);
  margin-left: 25px;
  transition: filter 0.3s ease, transform 0.3s ease;
}

.video-thumbnail:hover video {
  filter: brightness(1);
  transform: scale(1.05);
}

/* Botón de play en el centro */
.play-button {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 4rem;
  color: white;
  opacity: 0.8;
  transition: transform 0.3s ease, opacity 0.3s ease;
  pointer-events: none; /* evita interferir con el clic */
}

.video-thumbnail:hover .play-button {
  transform: translate(-50%, -50%) scale(1.1);
  opacity: 1;
}

  </style>
</head>
