<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Galería - Carrusel</title>
<style>
  body {
    margin: 0;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
    color: white; /* Para que el botón de cerrar y flechas se vean */
  }

  .slider-container { /* Renombrado de .slider a .slider-container para mayor claridad */
    position: relative;
    width: 90vw;
    height: 90vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .media-viewer {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    /* transition: opacity 0.5s ease; */
  }

  .arrow {
    position: absolute;
    top: 50%;
    width: 60px;
    height: 60px;
    background: rgba(255,255,255,0.4);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    cursor: pointer;
    user-select: none;
    transform: translateY(-50%);
    color: black; /* Color de las flechas */
    text-decoration: none;
  }

  .arrow:hover {
    background: rgba(255,255,255,0.8);
  }

  #prev { left: 20px; }
  #next { right: 20px; }

  #close {
    position: absolute;
    top: 20px;
    right: 20px;
    font-size: 30px;
    color: white;
    cursor: pointer;
    text-decoration: none;
    z-index: 10; /* Asegura que el botón cerrar esté por encima de la imagen/vídeo */
  }
  
  #counter {
    position: absolute;
    top: 20px;
    left: 20px;
    color: red;
    font-size: 30px;
  }
</style>
</head>

<body>

<a id="close" href="javascript:history.back()">✕</a>

<div class="slider-container">
  <div id="prev" class="arrow">❮</div>
  <!-- Este contenedor vacío será llenado por JS con <img> o <video> -->
  <div id="media-wrapper" style="display: flex; justify-content: center; align-items: center; width: 100%; height: 100%;"></div>
  <div id="next" class="arrow">❯</div>
  <div id="counter"></div>
</div>

<script>
  // NOTA: Estos 'sets' deben estar definidos también en tu página principal (index.html) 
  // para que la navegación inicial sepa a qué set pertenece cada miniatura.
  const sets = {
    1: [
      "Galeria_2023_archivos/Miercoles.jpg",
      "Galeria_2023_archivos/Miercoles_1.jpg",
      "Galeria_2023_archivos/Miercoles_2.jpg",
      "Galeria_2023_archivos/Miercoles_3.jpg",
      "Galeria_2023_archivos/Miercoles_4.jpg",
      "Galeria_2023_archivos/Miercoles_5.jpg"
    ],
    2: [
        "Galeria_2023_archivos/Jueves_1.jpg",
        "Galeria_2023_archivos/Jueves_1_1.jpg",
        "Galeria_2023_archivos/Jueves_1_2.jpg",
        "Galeria_2023_archivos/Jueves_1_3.jpg",
        
    ],
    3: [
        "Galeria_2023_archivos/Jueves_2.jpg",
        "Galeria_2023_archivos/Jueves_2_1.jpg",
        "Galeria_2023_archivos/Jueves_2_2.jpg",
        "Galeria_2023_archivos/Jueves_2_3.jpg"
    ],
    4:[
        "Galeria_2023_archivos/Jueves_3.jpg",
        "Galeria_2023_archivos/Jueves_3_1.jpg",
        "Galeria_2023_archivos/Jueves_3_2.jpg",
        "Galeria_2023_archivos/Jueves_3_3.jpg",
        "Galeria_2023_archivos/Jueves_3_4.jpg"
       
    ],
    5:[
        "Galeria_2023_archivos/Jueves_4.jpg"
   ],
    6:[
        "Galeria_2023_archivos/Jueves_5.jpg",
        "Galeria_2023_archivos/Jueves_5_1.jpg",
        "Galeria_2023_archivos/Jueves_5_2.jpg",
        "Galeria_2023_archivos/Jueves_5_3.jpg",
        "Galeria_2023_archivos/Jueves_5_4.jpg",
        "Galeria_2023_archivos/Jueves_5_5.jpg"
    ],

    7:[
        "Galeria_2023_archivos/Jueves_6.jpg",
        "Galeria_2023_archivos/Jueves_6_1.jpg",
        "Galeria_2023_archivos/Jueves_6_2.jpg",
        "Galeria_2023_archivos/Jueves_6_3.jpg",
        "Galeria_2023_archivos/Jueves_6_4.jpg",
        "Galeria_2023_archivos/Jueves_6_5.jpg",
        "Galeria_2023_archivos/Jueves_6_6.jpg"
    ],
    
    8:[
        "Galeria_2023_archivos/Viernes_1.jpg",
        "Galeria_2023_archivos/Viernes_1_1.jpg",
        "Galeria_2023_archivos/Viernes_1_2.jpg",
        "Galeria_2023_archivos/Viernes_1_3.jpg"
    ],
    9:[
       "Galeria_2023_archivos/Viernes_2.jpg",
       "Galeria_2023_archivos/Viernes_2_1.jpg",
       "Galeria_2023_archivos/Viernes_2_2.jpg",
       "Galeria_2023_archivos/Viernes_2_3.jpg",
       "Galeria_2023_archivos/Viernes_2_4.jpg"
    ],
    10:[
      "Galeria_2023_archivos/Viernes_3.jpg",
       "Galeria_2023_archivos/Viernes_3_1.jpg",
       "Galeria_2023_archivos/Viernes_3_2.jpg",
       "Galeria_2023_archivos/Viernes_3_3.jpg",
       "Galeria_2023_archivos/Viernes_3_4.jpg"
  ],
  11:[
      "Galeria_2023_archivos/Viernes_4.jpg",
      "Galeria_2023_archivos/Viernes_4_1.jpg",
      "Galeria_2023_archivos/Viernes_4_2.jpg"
 ] ,   
  12:[
      "Galeria_2023_archivos/Viernes_5.jpg",
      "Galeria_2023_archivos/Viernes_5_1.jpg",
      "Galeria_2023_archivos/Viernes_5_2.jpg"
  ] ,
  13:[
    "Galeria_2023_archivos/Adios.jpg",
  ]    
  };

 

  // Leer parámetros de la URL
  const params = new URLSearchParams(window.location.search);
  const setKey = params.get("set"); // Usamos setKey para evitar conflictos de nombres
  // El parámetro 'img' de la URL debería empezar en 1 (ej: ?set=1&img=1)
  let index = Number(params.get("img")) - 1; 

  const images = sets[setKey];
  const mediaWrapper = document.getElementById("media-wrapper");
  const counter = document.getElementById("counter");

  function show() {
    if (!images || images.length === 0) return;

    const currentSrc = images[index];
    
    // Limpiamos el contenedor por si había un elemento previo (img o video)
    mediaWrapper.innerHTML = ''; 

    let mediaElement;

    if (currentSrc.endsWith('.mp4')) {
      // Si es un vídeo, creamos un elemento <video>
      mediaElement = document.createElement('video');
      mediaElement.src = currentSrc;
      mediaElement.controls = true; // Muestra los controles de reproducción
      mediaElement.autoplay = true; // Reproducción automática al cargar
      mediaElement.muted = false; // Con sonido
    } else {
      // Si es una imagen, creamos un elemento <img>
      mediaElement = document.createElement('img');
      mediaElement.src = currentSrc;
    }

    // Añadimos una clase común para aplicar estilos (ancho/alto máximo)
    mediaElement.classList.add('media-viewer'); 
    
    // Insertamos el elemento en la página
    mediaWrapper.appendChild(mediaElement);

    // Actualizamos el contador visual
    counter.textContent = `${index + 1} / ${images.length}`;
  }

  document.getElementById("prev").onclick = () => {
    index = (index - 1 + images.length) % images.length;
    show();
  };

  document.getElementById("next").onclick = () => {
    index = (index + 1) % images.length;
    show();
  };

  show(); // mostrar el primer elemento al cargar
</script>

</body>
</html>
