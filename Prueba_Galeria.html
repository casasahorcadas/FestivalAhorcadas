<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prueba de franja</title>
<style>
  body {
    background: #e9e9e9;
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 40px;
    text-align: center;
  }

  .gallery {
    display: flex;
    gap: 20px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .photo-card {
    width: 300px;
    background: white;
    border-radius: 12px;
    border: 3px solid #ddd;
    overflow: hidden;
    box-shadow: 4px 4px 12px rgba(0,0,0,0.1);
  }

  .photo-card img {
    width: 100%;
    height: 250px;
    object-fit: cover;
    display: block;
  }

  .caption-bar {
    background: #c0392b; /* rojo fuerte para que se vea */
    color: #fff;
    text-align: center;
    font-weight: bold;
    font-size: 1.1rem;
    padding: 12px 0;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
</style>
</head>
<body>

  <div class="gallery">
    <div class="photo-card">
      <img src="Galeria_2025_archivos/image001.jpg" alt="Foto 1">
      <div class="caption-bar">Presentación Inaugural</div>
    </div>

    <div class="photo-card">
      <img src="Galeria_2025_archivos/Tormo_JLinares.jpg" alt="Foto 2">
      <div class="caption-bar">Montañas al Amanecer</div>
    </div>
  </div>

</body>
</html>
