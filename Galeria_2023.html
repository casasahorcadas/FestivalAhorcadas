  <!-- Fuente tipo máquina de escribir -->
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">

  <!-- Iconos Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="icon" href="img/Logo.jpg">

  <style>
    /* Mantener la fuente en todo el sitio */
    body { font-family: 'Special Elite', serif; }
    .site-title { letter-spacing: 1px; }
    @media (max-width: 640px) {
      .site-title { font-size: 1.15rem; }
      .site-subtitle { font-size: 1rem; color: #e50914; }
    }
      .home {
      position: fixed;
      top: 80px;
      right: 80px;
      background: rgba(0,0,0,0.6);
      color: white;
      padding: 10px 14px;
      border-radius: 50%;
      text-decoration: none;
      font-size: 32px;
    }
    .home:hover {
      background: rgba(255,0,0,0.8);
    }
    img {
      max-width: 100%;
      max-height: 100%;
    }
  /* ======== GALERÍA ======== */
    .galeria-completa-wrapper {
      background-color: white;
      padding: 5px; /* Añade algo de espacio alrededor de las fotos */
  }
    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center; /* Distribuye el espacio uniformemente */
      gap:20px;
      margin: 0 !important;
      padding: 0 !important;
               }

    .photo-card {
    /* En escritorio (3 columnas), cada tarjeta ocupará aproximadamente un tercio del ancho */
       width: calc(25% -10px); /* Ajusta el 10px según el espacio deseado entre fotos */
       margin: 20px;
       
      }

    .photo-card:hover {
      transform: translateY(-0.3vw);
      box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.2);
    }

    .photo-card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      display: block;
      cursor: pointer;
      transition: transform 0.4s ease, filter 0.4s ease;
    }

    .photo-card img:hover {
      transform: scale(1.01);
      filter: brightness(1.05);
    }

    
  .caption-bar {
    background: #222;              /* color de fondo de la franja */
    color: #fff;                   /* texto blanco */
    text-align: center;
    font-weight: 500;
    font-size: 1rem;
    padding: 10px 0;
    border-top: 3px solid #e3e3e3; /* línea separadora elegante */
    transition: background 0.3s ease, color 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

/* Efecto al pasar el ratón por la tarjeta */
  .photo-card:hover .caption-bar {
    background: #444;
    color: #f0f0f0;
  }

    /* ======== RESPONSIVE ======== */
 @media only screen and (max-width: 600px) {
  .gallery {     /* En móvil, las fotos pueden apilarse o seguir un flujo más compacto */
    justify-content: center; /* Centra las tarjetas si es necesario */
  }
  
  .photo-card {
    width: 100% !important;
    max-width: 100% !important;
    padding: 5px;
    margin: 0 0 15px 0;
  }
  .photo-card img {
  width: 100%;
  height: auto;
  display: block;
}
.photo-card,
.gallery {
  overflow: visible !important;
}
}
  </style>
</head>
