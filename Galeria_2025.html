    /* Mantener la fuente en todo el sitio */
    body { font-family: 'Special Elite', serif; }
    .site-title { letter-spacing: 1px; }
    @media (max-width: 640px) {
      .site-title { font-size: 1.15rem; }
      .site-subtitle { font-size: 1rem; color: #e50914; }
    }
  /* ======== GALERÍA ======== */
/* ======== GALERÍA ======== */
    .gallery {
      display: flex;
      flex-wrap: wrap;
      gap: 100px;
      justify-content: center;
      padding: 30px;
    }

    .photo-card {
     width: 300px;
     height: auto;
     background: white;
     border-radius: 12px;
     border: 3px solid #ddd; 
     overflow: hidden;
     box-shadow: 8px 8px 20px rgba(0, 0, 0, 0.1);
     transition: all 0.3s ease;
    
      }

    .photo-card:hover {
      transform: translateY(-0.3vw);
      box-shadow: 0px 10px 25px rgba(0, 0, 0, 0.2);
    }

    .photo-card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
      display: block;
      cursor: pointer;
      transition: transform 0.4s ease, filter 0.4s ease;
    }

    .photo-card img:hover {
      transform: scale(1.07);
      filter: brightness(1.05);
    }

    
  .caption-bar {
    background: #222;              /* color de fondo de la franja */
    color: #fff;                   /* texto blanco */
    text-align: center;
    font-weight: 500;
    font-size: 1rem;
    padding: 10px 0;
    border-top: 3px solid #e3e3e3; /* línea separadora elegante */
    transition: background 0.3s ease, color 0.3s ease;
    text-transform: uppercase;
    letter-spacing: 1px;
  }

/* Efecto al pasar el ratón por la tarjeta */
  .photo-card:hover .caption-bar {
    background: #444;
    color: #f0f0f0;
  }

    /* ======== RESPONSIVE ======== */
 @media (max-width: 768px) {
      .photo-card img {
        height: 200px;
      }
    }
  @media (max-width: 600px) {
  .no-mobile-break {
    display: none;
  }
}  

    @media (max-width: 480px) {
      .photo-card {
        width: 90%;
      }
      .photo-card img {
        height: 180px;
      }
    }

  </style>
</head>
